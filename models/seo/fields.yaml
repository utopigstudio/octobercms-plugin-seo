# ===================================
#  Field Definitions
# ===================================

fields:
    type:
        label: utopigs.seo::lang.seo.type
        type: dropdown
        span: left
    reference:
        label: utopigs.seo::lang.seo.page
        type: dropdown
        span: left
        dependsOn: type
    no_index:
        label: utopigs.seo::lang.seo.no_index
        type: switch
        span: left
        comment: utopigs.seo::lang.seo.no_index_comment
        default: false
    title:
        label: utopigs.seo::lang.seo.title
        span: left
        trigger:
            action: hide
            field: no_index
            condition: checked
        required: true
    description:
        label: utopigs.seo::lang.seo.description
        span: left
        type: textarea
        size: small
        trigger:
            action: hide
            field: no_index
            condition: checked
    keywords:
        label: utopigs.seo::lang.seo.keywords
        span: left
        type: textarea
        size: small
        comment: utopigs.seo::lang.seo.keywords_hint
        trigger:
            action: hide
            field: no_index
            condition: checked
    og_type:
        label: utopigs.seo::lang.seo.og_type
        type: dropdown
        span: left
        options:
            default: utopigs.seo::lang.seo.og_type_default
            website: utopigs.seo::lang.seo.og_type_website
            article: utopigs.seo::lang.seo.og_type_article
            book: utopigs.seo::lang.seo.og_type_book
            profile: utopigs.seo::lang.seo.og_type_profile
    image:
        label: utopigs.seo::lang.seo.image
        type: fileupload
        mode: image
        span: left
        imageHeight: 260
        trigger:
            action: hide
            field: no_index
            condition: checked
